name: saywhat
version: 0.1.0
manifest_version: 2
description: >-
  Voice input that asks instead of guessing. A local faster-whisper STT provider
  that measures per-word confidence, has the agent offer sentence- then word-level
  choices for anything it misheard, learns a personal dictionary from your picks,
  and coaches your pronunciation with a practice loop.
author: muhammadaus
license: MIT
homepage: https://github.com/muhammadaus/saywhat
tags: [voice, stt, dictation, pronunciation, accessibility]
requires_hermes: ">=0.21.5"
provides_tools: []
provides_hooks: []
