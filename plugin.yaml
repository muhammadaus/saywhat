name: saywhat
version: 0.1.0
manifest_version: 2
description: >-
  Voice input that asks instead of guessing. A local faster-whisper STT provider
  that measures per-word confidence, has the agent offer sentence- then word-level
  choices for anything it misheard, learns a personal dictionary from your picks,
  and coaches your pronunciation with a practice loop.
author: muhammadaus
license: MIT
homepage: https://github.com/muhammadaus/saywhat
tags: [voice, stt, dictation, pronunciation, accessibility]
requires_hermes: ">=0.21.5"
provides_tools:
  - saywhat_practice
  - saywhat_progress
  - saywhat_dictionary
provides_hooks:
  - pre_transcription
  - pre_llm_call
  - post_tool_call
config_schema:
  model: {type: str, default: base, label: Whisper model, choices: [tiny, base, small, medium, large-v3, distil-large-v3, turbo], description: "faster-whisper model size; larger is more accurate and slower."}
  language: {type: str, default: "", label: Language, description: "BCP-47 hint such as en or ja; empty auto-detects."}
  device: {type: str, default: auto, label: Device, choices: [auto, cpu, cuda], description: "Where faster-whisper runs."}
  threshold: {type: float, default: 0.6, label: Ask below confidence, description: "Words the recognizer is less sure of than this (0-1) are confirmed with you."}
  auto_correct_after: {type: int, default: 3, label: Auto-correct after, description: "Confirm a mishearing this many times and saywhat fixes it silently."}
  max_candidates: {type: int, default: 4, label: Choices per word, description: "Candidates offered per uncertain word (clarify shows at most 4)."}
  match_window_seconds: {type: int, default: 300, label: Match window (s), description: "How long a recording stays eligible to be matched to your next message."}
